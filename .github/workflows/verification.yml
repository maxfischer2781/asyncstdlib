name: Static Checks
permissions: {}

on:
  push:
  pull_request:
  schedule:
    - cron: '0 10 * * 3,6'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test,typetest]
    - name: Lint with flake8
      run: |
        flake8 asyncstdlib unittests
    - name: Format with black
      run: |
        black asyncstdlib unittests --diff --check
    - name: Verify with MyPy
      run: |
        mypy --pretty
    - name: Verify with PyRight
      uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef
